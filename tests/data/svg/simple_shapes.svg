<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Rectangle -->
  <rect id="rect1" x="10" y="10" width="150" height="80"
        fill="#E3F2FD" stroke="#1976D2" stroke-width="2"
        data-label="Web Server"/>

  <!-- Circle (becomes ellipse in IR) -->
  <circle id="circle1" cx="250" cy="50" r="40"
          fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>
  <text x="230" y="55" font-size="14" fill="#000000">User</text>

  <!-- Ellipse -->
  <ellipse id="ellipse1" cx="420" cy="50" rx="80" ry="40"
           fill="#E8F5E9" stroke="#388E3C" stroke-width="2"
           data-label="Database"/>

  <!-- Diamond (polygon with 4 points) -->
  <polygon id="diamond1" points="300,150 350,200 300,250 250,200"
           fill="#FFF3E0" stroke="#F57C00" stroke-width="2"
           data-label="Decision"/>

  <!-- Another rectangle with different styling -->
  <rect id="rect2" x="50" y="300" width="120" height="60"
        fill="none" stroke="#4CAF50" stroke-width="3" stroke-dasharray="5,5"
        data-label="Service"/>
</svg>
