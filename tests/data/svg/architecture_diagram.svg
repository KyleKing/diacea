<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Title -->
  <text x="300" y="30" font-size="20" font-weight="bold" fill="#333">E-Commerce Architecture</text>

  <!-- User/Person -->
  <circle id="user1" cx="100" cy="120" r="50"
          fill="#FFE0B2" stroke="#E65100" stroke-width="2"
          data-semantic="person"/>
  <text x="75" y="125" font-size="16" fill="#000">User</text>

  <!-- Web Application (System) -->
  <rect id="webapp" x="250" y="80" width="200" height="120"
        fill="#E3F2FD" stroke="#1565C0" stroke-width="3"
        data-semantic="system"/>
  <text x="310" y="145" font-size="18" font-weight="bold" fill="#000">Web App</text>

  <!-- API Gateway (Service) -->
  <rect id="api" x="250" y="250" width="200" height="80"
        fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"
        data-semantic="service"/>
  <text x="315" y="295" font-size="16" fill="#000">API Gateway</text>

  <!-- Database -->
  <ellipse id="database1" cx="600" cy="150" rx="100" ry="60"
           fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"
           data-semantic="database"/>
  <text x="565" y="155" font-size="16" fill="#000">PostgreSQL</text>

  <!-- Message Queue -->
  <rect id="queue1" x="500" y="270" width="180" height="70"
        fill="#FFF9C4" stroke="#F57F17" stroke-width="2"
        data-semantic="queue"/>
  <text x="555" y="310" font-size="16" fill="#000">RabbitMQ</text>

  <!-- Cloud Storage -->
  <ellipse id="storage1" cx="600" cy="430" rx="90" ry="50"
           fill="#E0F7FA" stroke="#00838F" stroke-width="2"
           data-semantic="storage"/>
  <text x="560" y="435" font-size="16" fill="#000">S3 Storage</text>

  <!-- External Payment Service -->
  <rect id="external1" x="50" y="350" width="150" height="80"
        fill="#EFEBE9" stroke="#4E342E" stroke-width="2" stroke-dasharray="5,5"
        data-semantic="external"/>
  <text x="80" y="395" font-size="14" fill="#000">Payment API</text>

  <!-- Lines representing connections (basic - won't be fully parsed as connections) -->
  <line x1="150" y1="120" x2="250" y2="140" stroke="#666" stroke-width="2"/>
  <line x1="350" y1="200" x2="350" y2="250" stroke="#666" stroke-width="2"/>
  <line x1="450" y1="150" x2="500" y2="150" stroke="#666" stroke-width="2"/>
  <line x1="450" y1="290" x2="500" y2="290" stroke="#666" stroke-width="2"/>
</svg>
