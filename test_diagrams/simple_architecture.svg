<?xml version="1.0" encoding="UTF-8"?>
<!-- Simple Microservices Architecture - SVG Format -->
<!-- This can be imported and converted to other diagram formats -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <!-- Title -->
  <text x="400" y="20" font-size="16" font-weight="bold" text-anchor="middle">
    Microservices Architecture
  </text>

  <!-- User (Person) -->
  <ellipse id="user" cx="80" cy="200" rx="40" ry="40"
           fill="#87CEEB" stroke="black" stroke-width="2"
           data-semantic="person"/>
  <text x="80" y="205" font-size="12" text-anchor="middle" fill="black">User</text>

  <!-- API Gateway -->
  <g id="api_gateway" data-semantic="component">
    <rect x="180" y="170" width="120" height="60"
          fill="#90EE90" stroke="black" stroke-width="2" rx="5"/>
    <text x="240" y="205" font-size="12" text-anchor="middle" fill="black">API Gateway</text>
  </g>

  <!-- Services Container -->
  <g id="services" data-semantic="system">
    <rect x="350" y="50" width="400" height="300"
          fill="none" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="360" y="70" font-size="14" font-weight="bold" fill="#666">Services</text>

    <!-- Auth Service -->
    <g id="auth_service" data-semantic="service">
      <rect x="370" y="90" width="100" height="50"
            fill="#E0E0E0" stroke="black" stroke-width="1"/>
      <text x="420" y="120" font-size="11" text-anchor="middle">Auth Service</text>
    </g>

    <!-- Order Service -->
    <g id="order_service" data-semantic="service">
      <rect x="370" y="160" width="100" height="50"
            fill="#E0E0E0" stroke="black" stroke-width="1"/>
      <text x="420" y="190" font-size="11" text-anchor="middle">Order Service</text>
    </g>

    <!-- Product Service -->
    <g id="product_service" data-semantic="service">
      <rect x="370" y="230" width="100" height="50"
            fill="#E0E0E0" stroke="black" stroke-width="1"/>
      <text x="420" y="260" font-size="11" text-anchor="middle">Product Service</text>
    </g>

    <!-- Auth Database -->
    <g id="auth_db" data-semantic="database">
      <ellipse cx="600" cy="115" rx="60" ry="30"
               fill="#FFE4B5" stroke="black" stroke-width="1"/>
      <text x="600" y="120" font-size="10" text-anchor="middle">Auth DB</text>
    </g>

    <!-- Order Database -->
    <g id="order_db" data-semantic="database">
      <ellipse cx="600" cy="185" rx="60" ry="30"
               fill="#FFE4B5" stroke="black" stroke-width="1"/>
      <text x="600" y="190" font-size="10" text-anchor="middle">Order DB</text>
    </g>

    <!-- Product Database -->
    <g id="product_db" data-semantic="database">
      <ellipse cx="600" cy="255" rx="60" ry="30"
               fill="#FFE4B5" stroke="black" stroke-width="1"/>
      <text x="600" y="260" font-size="10" text-anchor="middle">Product DB</text>
    </g>
  </g>

  <!-- Message Queue -->
  <g id="message_queue" data-semantic="queue">
    <rect x="370" y="300" width="100" height="40"
          fill="#FFD700" stroke="black" stroke-width="2"/>
    <text x="420" y="325" font-size="11" text-anchor="middle">Message Queue</text>
  </g>

  <!-- Connections/Arrows -->
  <!-- User to API Gateway -->
  <line x1="120" y1="200" x2="180" y2="200"
        stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="150" y="195" font-size="9" fill="blue">HTTPS</text>

  <!-- API Gateway to Auth Service -->
  <line x1="300" y1="190" x2="370" y2="115"
        stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- API Gateway to Order Service -->
  <line x1="300" y1="200" x2="370" y2="185"
        stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- API Gateway to Product Service -->
  <line x1="300" y1="210" x2="370" y2="255"
        stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Auth Service to Auth DB -->
  <line x1="470" y1="115" x2="540" y2="115"
        stroke="blue" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Order Service to Order DB -->
  <line x1="470" y1="185" x2="540" y2="185"
        stroke="blue" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Product Service to Product DB -->
  <line x1="470" y1="255" x2="540" y2="255"
        stroke="blue" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Order Service to Message Queue (dashed) -->
  <line x1="420" y1="210" x2="420" y2="300"
        stroke="green" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowhead)"/>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10"
            refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="black"/>
    </marker>
  </defs>
</svg>
