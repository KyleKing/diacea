<?xml version="1.0" encoding="UTF-8"?>
<!-- Complex Multi-Cloud Architecture - SVG Format -->
<!-- Demonstrates nested systems, multiple semantic types, complex relationships -->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <!-- Title -->
  <text x="500" y="25" font-size="18" font-weight="bold" text-anchor="middle">
    Multi-Cloud E-Commerce Platform
  </text>

  <!-- External Users -->
  <g id="external_users">
    <ellipse id="mobile_user" cx="60" cy="100" rx="35" ry="35"
             fill="#87CEEB" stroke="black" stroke-width="2" data-semantic="person"/>
    <text x="60" y="105" font-size="11" text-anchor="middle">Mobile</text>

    <ellipse id="web_user" cx="60" cy="200" rx="35" ry="35"
             fill="#87CEEB" stroke="black" stroke-width="2" data-semantic="person"/>
    <text x="60" y="205" font-size="11" text-anchor="middle">Web</text>

    <ellipse id="admin" cx="60" cy="300" rx="35" ry="35"
             fill="#FFB6C1" stroke="black" stroke-width="2" data-semantic="person"/>
    <text x="60" y="305" font-size="11" text-anchor="middle">Admin</text>
  </g>

  <!-- AWS Cloud Boundary -->
  <g id="aws_cloud" data-semantic="cloud">
    <rect x="130" y="50" width="400" height="500"
          fill="#FFF5E6" stroke="#FF9900" stroke-width="3" rx="10"/>
    <text x="140" y="75" font-size="14" font-weight="bold" fill="#FF9900">AWS Cloud</text>

    <!-- CDN/CloudFront -->
    <g id="cdn" data-semantic="external">
      <polygon points="330,100 360,85 390,100 360,115"
               fill="#FFA500" stroke="black" stroke-width="1.5"/>
      <text x="360" y="105" font-size="10" text-anchor="middle">CDN</text>
    </g>

    <!-- Load Balancer -->
    <g id="load_balancer" data-semantic="component">
      <rect x="300" y="140" width="120" height="40"
            fill="#90EE90" stroke="black" stroke-width="2" rx="5"/>
      <text x="360" y="165" font-size="11" text-anchor="middle">Load Balancer</text>
    </g>

    <!-- Application Layer -->
    <g id="app_layer" data-semantic="system">
      <rect x="150" y="200" width="360" height="150"
            fill="white" stroke="#4169E1" stroke-width="2" stroke-dasharray="3,3"/>
      <text x="160" y="220" font-size="12" font-weight="bold" fill="#4169E1">
        Application Tier (EKS)
      </text>

      <g id="api_service_1" data-semantic="container">
        <rect x="170" y="235" width="80" height="50" fill="#B0C4DE" stroke="black" stroke-width="1"/>
        <text x="210" y="265" font-size="10" text-anchor="middle">API-1</text>
      </g>

      <g id="api_service_2" data-semantic="container">
        <rect x="270" y="235" width="80" height="50" fill="#B0C4DE" stroke="black" stroke-width="1"/>
        <text x="310" y="265" font-size="10" text-anchor="middle">API-2</text>
      </g>

      <g id="api_service_3" data-semantic="container">
        <rect x="370" y="235" width="80" height="50" fill="#B0C4DE" stroke="black" stroke-width="1"/>
        <text x="410" y="265" font-size="10" text-anchor="middle">API-3</text>
      </g>

      <g id="worker_service" data-semantic="container">
        <rect x="170" y="295" width="80" height="45" fill="#DDA0DD" stroke="black" stroke-width="1"/>
        <text x="210" y="322" font-size="10" text-anchor="middle">Worker</text>
      </g>

      <g id="scheduler" data-semantic="container">
        <rect x="270" y="295" width="80" height="45" fill="#DDA0DD" stroke="black" stroke-width="1"/>
        <text x="310" y="322" font-size="10" text-anchor="middle">Scheduler</text>
      </g>
    </g>

    <!-- Data Layer -->
    <g id="data_layer" data-semantic="system">
      <rect x="150" y="370" width="360" height="160"
            fill="white" stroke="#8B4513" stroke-width="2" stroke-dasharray="3,3"/>
      <text x="160" y="390" font-size="12" font-weight="bold" fill="#8B4513">
        Data Tier
      </text>

      <g id="primary_db" data-semantic="database">
        <ellipse cx="240" cy="440" rx="70" ry="35"
                 fill="#FFE4B5" stroke="black" stroke-width="2"/>
        <text x="240" y="445" font-size="10" text-anchor="middle">Primary DB</text>
        <text x="240" y="458" font-size="9" text-anchor="middle" fill="#666">(PostgreSQL)</text>
      </g>

      <g id="read_replica" data-semantic="database">
        <ellipse cx="380" cy="440" rx="70" ry="35"
                 fill="#FFE4B5" stroke="black" stroke-width="1.5" stroke-dasharray="2,2"/>
        <text x="380" y="445" font-size="10" text-anchor="middle">Read Replica</text>
      </g>

      <g id="cache" data-semantic="storage">
        <rect x="160" y="490" width="100" height="30"
              fill="#FF6347" stroke="black" stroke-width="1.5"/>
        <text x="210" y="510" font-size="10" text-anchor="middle">Redis Cache</text>
      </g>

      <g id="s3_storage" data-semantic="storage">
        <rect x="280" y="490" width="100" height="30"
              fill="#98FB98" stroke="black" stroke-width="1.5"/>
        <text x="330" y="510" font-size="10" text-anchor="middle">S3 Storage</text>
      </g>

      <g id="message_queue" data-semantic="queue">
        <rect x="400" y="490" width="90" height="30"
              fill="#FFD700" stroke="black" stroke-width="2"/>
        <text x="445" y="510" font-size="10" text-anchor="middle">SQS Queue</text>
      </g>
    </g>
  </g>

  <!-- GCP Cloud Boundary (Smaller, for specific services) -->
  <g id="gcp_cloud" data-semantic="cloud">
    <rect x="570" y="150" width="200" height="200"
          fill="#F0F8FF" stroke="#4285F4" stroke-width="3" rx="10"/>
    <text x="580" y="175" font-size="14" font-weight="bold" fill="#4285F4">GCP Cloud</text>

    <g id="ml_service" data-semantic="service">
      <rect x="590" y="195" width="160" height="50"
            fill="#E6E6FA" stroke="black" stroke-width="1.5"/>
      <text x="670" y="225" font-size="11" text-anchor="middle">ML Prediction</text>
      <text x="670" y="238" font-size="9" text-anchor="middle" fill="#666">(Vertex AI)</text>
    </g>

    <g id="analytics_db" data-semantic="database">
      <ellipse cx="670" cy="295" rx="75" ry="35"
               fill="#F0E68C" stroke="black" stroke-width="1.5"/>
      <text x="670" y="300" font-size="10" text-anchor="middle">Analytics DB</text>
      <text x="670" y="313" font-size="9" text-anchor="middle" fill="#666">(BigQuery)</text>
    </g>
  </g>

  <!-- External Services -->
  <g id="external_services">
    <g id="payment_gateway" data-semantic="external">
      <polygon points="820,100 900,100 910,125 890,150 810,150 800,125"
               fill="#FFFACD" stroke="black" stroke-width="2"/>
      <text x="855" y="130" font-size="11" text-anchor="middle">Payment</text>
      <text x="855" y="143" font-size="9" text-anchor="middle">(Stripe)</text>
    </g>

    <g id="email_service" data-semantic="external">
      <polygon points="820,200 900,200 910,225 890,250 810,250 800,225"
               fill="#FFFACD" stroke="black" stroke-width="2"/>
      <text x="855" y="230" font-size="11" text-anchor="middle">Email</text>
      <text x="855" y="243" font-size="9" text-anchor="middle">(SendGrid)</text>
    </g>

    <g id="monitoring" data-semantic="external">
      <polygon points="820,300 900,300 910,325 890,350 810,350 800,325"
               fill="#FFFACD" stroke="black" stroke-width="2"/>
      <text x="855" y="330" font-size="11" text-anchor="middle">Monitoring</text>
      <text x="855" y="343" font-size="9" text-anchor="middle">(Datadog)</text>
    </g>
  </g>

  <!-- Connections -->
  <!-- Users to CDN -->
  <line x1="95" y1="100" x2="320" y2="100" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="95" y1="200" x2="300" y2="120" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="95" y1="300" x2="310" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CDN to Load Balancer -->
  <line x1="360" y1="115" x2="360" y2="140" stroke="blue" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Load Balancer to API Services -->
  <line x1="330" y1="180" x2="210" y2="235" stroke="green" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="180" x2="310" y2="235" stroke="green" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="180" x2="410" y2="235" stroke="green" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- API Services to Primary DB -->
  <line x1="210" y1="285" x2="240" y2="405" stroke="purple" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="285" x2="270" y2="405" stroke="purple" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="285" x2="300" y2="405" stroke="purple" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Primary DB to Read Replica (replication) -->
  <line x1="310" y1="440" x2="310" y2="440" stroke="red" stroke-width="1.5"
        stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <line x1="310" y1="440" x2="340" y2="440" stroke="red" stroke-width="1.5"
        stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- API to Cache -->
  <line x1="210" y1="285" x2="210" y2="490" stroke="orange" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Worker to Queue -->
  <line x1="250" y1="318" x2="400" y2="505" stroke="green" stroke-width="1.5"
        stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <!-- API to ML Service (GCP) -->
  <line x1="450" y1="260" x2="590" y2="220" stroke="brown" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Data sync to Analytics -->
  <line x1="450" y1="440" x2="595" y2="295" stroke="teal" stroke-width="1.5"
        stroke-dasharray="5,5" marker-end="url(#arrow)"/>

  <!-- API to External Services -->
  <line x1="510" y1="260" x2="820" y2="125" stroke="darkgreen" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="270" x2="820" y2="225" stroke="darkgreen" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="320" x2="820" y2="325" stroke="gray" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="black"/>
    </marker>
  </defs>
</svg>
