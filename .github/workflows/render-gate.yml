# Standalone workflow (not managed by calcipy_template): renders the curated
# fixture matrix with the real diagram tools. Kept separate from ci_pipeline.yml
# so missing or broken renderers never block the main test job.
name: Render Gate

"on":
  pull_request:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          python-version: "3.10"

      - name: Install renderers
        env:
          PLANTUML_VERSION: "1.2025.4"
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz default-jre-headless
          # apt ships PlantUML 1.2020, which predates the hexagon shape and the current C4 library
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/plantuml"
          curl -fsSL -o "$HOME/.local/share/plantuml/plantuml.jar" \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar"
          printf '#!/bin/sh\nexec java -Djava.awt.headless=true -jar "%s" "$@"\n' \
            "$HOME/.local/share/plantuml/plantuml.jar" > "$HOME/.local/bin/plantuml"
          chmod +x "$HOME/.local/bin/plantuml"
          npm install --global @mermaid-js/mermaid-cli
          curl -fsSL https://d2lang.com/install.sh | sh -s --
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Allow Chrome sandbox for mermaid-cli
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run render-gated tests
        run: uv run nox -s render_gate
