[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9.26,<2.0"]

[dependency-groups]
dev = [
  "calcipy[recommended]>=6.0.1",
  "hypothesis>=6.100",
  "lzstring>=1.0.4",
  "types-defusedxml>=0.7",
  "types-pyyaml>=6.0",
]

[project]
authors = [
  {email = "dev.act.kyle@gmail.com", name = "Kyle King"},
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
] # https://pypi.org/classifiers/
dependencies = [
  "corallium>=2.2.0",
  "defusedxml>=0.7.1",
  "networkx>=3.4.2,<4",
  "python-constraint2>=2.0.0b8,<3",
  "pyyaml>=6.0,<7",
]
description = "Convert between Excalidraw and PlantUML"
keywords = ["calcipy_template"]
license = "MIT"
maintainers = []
name = "diacea"
readme = "docs/README.md"
requires-python = ">=3.10.11"
version = "0.0.1"

[project.entry-points."mkdocs.plugins"]
diacea = "diacea.mkdocs_plugin:DiaceaPlugin"

[project.optional-dependencies]
mkdocs = [
  "mkdocs>=1.5",
]
obsidian = [
  "lzstring>=1.0.4",
]

[project.scripts]
diacea = "diacea.cli:main"
diacea-workspace = "diacea.workspace_cli:main_workspace"

[project.urls]
"Bug Tracker" = "https://github.com/kyleking/diacea/issues"
"Changelog" = "https://github.com/kyleking/diacea/blob/main/docs/docs/CHANGELOG.md"
"Documentation" = "https://diacea.kyleking.me"
"Repository" = "https://github.com/kyleking/diacea"

[tool.commitizen]
pre_bump_hooks = ["uv lock"]
version = "0.0.1"
version_files = ["diacea/__init__.py:^__version", "pyproject.toml:^version"]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
enable_error_code = ["ignore-without-code", "possibly-undefined", "redundant-expr", "truthy-bool"]
extra_checks = true
files = ["diacea", "tests"]
no_implicit_reexport = true
plugins = [
]
python_version = "3.10"
show_column_numbers = true
show_error_codes = true
strict_equality = true
warn_no_return = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pyright]
include = ["diacea", "tests"]
pythonVersion = "3.10"

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
# Docs: https://github.com/charliermarsh/ruff
# Tip: uv run ruff rule unused-noqa
line-length = 120
target-version = 'py310'

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
ignore = [
  'any-type', # Dynamically typed expressions (typing.Any) are disallowed in `pop_key`
  'blind-except', # Do not catch blind exception: `Exception`
  # TODO: make the boolean parameters keyword-only and drop this
  'boolean-default-value-positional-argument', # Boolean default positional argument in function definition
  # TODO: make the boolean parameters keyword-only and drop this
  'boolean-type-hint-positional-argument', # Boolean-typed positional argument in function definition
  # TODO: split the oversized parser and generator entry points and drop this
  'complex-structure', # `parse` is too complex
  # TODO: reconcile each docstring `Raises` section with what the function raises and drop this
  'docstring-extraneous-exception', # Raised exception is not explicitly raised: `ValueError`
  'docstring-missing-exception', # Raised exception `RuntimeError` missing from docstring
  'docstring-missing-returns', # Missing "Returns" in docstring; prefer minimal docstrings
  # TODO: hoist the deferred imports to the top of their module and drop this
  'import-outside-top-level', # `import` should be at the top-level of a file
  'incorrect-blank-line-before-class', # "1 blank line required before class docstring" (Conflicts with blank-line-before-class)
  'invalid-todo-tag', # Invalid TODO tag: `FIXME`
  'line-contains-fixme', # Line contains FIXME
  'line-contains-hack', # Line contains HACK
  'line-contains-todo', # Line contains TODO
  # TODO: name the geometry and threshold constants and drop this
  'magic-value-comparison', # Magic value used in comparison
  'missing-copyright-notice', # Missing copyright notice at top of file
  # TODO: annotate the dunder methods and drop this
  'missing-return-type-special-method', # Missing return type annotation for special method `__init__`
  'missing-todo-author', # Missing author in TODO; try: `# TODO(<author_name>): ...`
  'missing-todo-link', # Missing issue link on the line following this TODO
  'missing-trailing-comma', # Conflicts with formatter
  'missing-type-args', # Missing type annotation for `*args`
  'missing-type-kwargs', # Missing type annotation for `**kwargs`
  'multi-line-summary-second-line', # "Multi-line docstring summary should start at the second line" (Conflicts with multi-line-summary-first-line)
  # TODO: annotate stateless methods as static and drop this
  'no-self-use', # Method could be a function, class method, or static method
  'non-empty-init-module', # `__init__` module should only contain docstrings and re-exports
  'noqa-comments', # Prefer `ruff: ignore` over `noqa`; `noqa` stays for cross-tool compatibility
  # TODO: replace print() in the library with logging and drop this
  'print', # `print` found
  # TODO: promote the internals these reach for to public API and drop this
  'private-member-access', # Private member accessed
  'raise-vanilla-args', # Avoid specifying long messages outside the exception class
  # TODO: narrow each try block to one failure mode and drop this
  'raise-within-try', # Abstract `raise` to an inner function
  'raw-string-in-exception', # Exception must not use a string literal, assign to variable first
  # TODO: convert the intra-package relative imports to absolute and drop this
  'relative-imports', # Prefer absolute imports over relative imports from parent modules
  'too-many-arguments', # Too many arguments in function definition (6 > 5)
  # TODO: split the branch-heavy dispatch functions and drop this
  'too-many-branches', # Too many branches
  # TODO: extract helpers from the long parser functions and drop this
  'too-many-locals', # Too many local variables
  # TODO: make the trailing parameters keyword-only and drop this
  'too-many-positional-arguments', # Too many positional arguments
  # TODO: split the branch-heavy dispatch functions and drop this
  'too-many-return-statements', # Too many return statements
  # TODO: extract helpers from the long parser functions and drop this
  'too-many-statements', # Too many statements
  # TODO: narrow each try block to one failure mode and drop this
  'too-many-statements-in-try-clause', # Try clause contains too many statements
  # TODO: raise TypeError for type mismatches and drop this
  'type-check-without-type-error', # Prefer `TypeError` exception for invalid type
  'typing-only-first-party-import', # Move application import `tail_jsonl.config.Config` into a type-checking block (Conflicts with Beartype)
  'typing-only-standard-library-import', # Move standard library import `argparse` into a type-checking block (Conflicts with Beartype)
  'typing-only-third-party-import', # Move third-party import `rich.console.Console` into a type-checking block (Conflicts with Beartype)
  # TODO: document the public classes and drop this
  'undocumented-public-class', # Missing docstring in public class
  # TODO: document the public constructors and drop this
  'undocumented-public-init', # Missing docstring in `__init__`
  # TODO: document the public methods and drop this
  'undocumented-public-method', # Missing docstring in public method
  # TODO: drop the unused parameters or prefix them with an underscore and drop this
  'unused-method-argument', # Unused method argument
]
preview = true
select = ['ALL']
unfixable = [
  'commented-out-code', # Commented out code
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'

[tool.ruff.lint.flake8-tidy-imports.banned-api]
'invoke.collection.Collection'.msg = 'Use calcipy.collection.Collection instead.'
'invoke.tasks.task'.msg = 'Use calcipy.cli.task instead.'
'typing.Callable'.msg = 'Use "from collections.abc" instead.'
'typing.Dict'.msg = 'Use "from __future__ import annotations"'
'typing.List'.msg = 'Use "from __future__ import annotations"'
'typing.Optional'.msg = 'Use "from __future__ import annotations"'
'typing.Protocol'.msg = 'Use "from beartype.typing" instead.'

[tool.ruff.lint.isort]
known-first-party = ['diacea']

[tool.ruff.lint.per-file-ignores]
'./diacea/../*.py' = [
  'implicit-namespace-package', # File `/<>.py` is part of an implicit namespace package. Add an `__init__.py`.
]
'__init__.py' = [
  'undocumented-public-package', # Missing docstring in public package
]
'scripts/*.py' = [
  # TODO: write benchmark output under tempfile.mkdtemp() and drop this
  'hardcoded-temp-file', # Probable insecure usage of temporary file or directory
  'implicit-namespace-package', # File `scripts/*.py` is part of an implicit namespace package. Add an `__init__.py`.
  'suspicious-non-cryptographic-random-usage', # Standard pseudo-random generators are not suitable for cryptographic purposes
  'undocumented-public-function', # Missing docstring in public function
]
'scripts/check_imports.py' = [
  'unused-import', # imported but unused; consider adding to __all__ or using a redundant alias
]
'tests/*.py' = [
  'assert', # Use of `assert` detected
  # TODO: compare parser float output with math.isclose and drop this
  'float-equality-comparison', # Use `math.isclose` instead of comparing floats
  'hardcoded-temp-file', # Probable insecure usage of temporary file or directory
  'import-private-name', # Private name import `_<>` from external module
  'missing-return-type-private-function', # Missing return type annotation for private function `test_make_diffable`
  'missing-return-type-undocumented-public-function', # Missing return type annotation for public function
  'missing-type-function-argument', # Missing type annotation for function argument
  'pytest-composite-assertion', # Assertion should be broken down into multiple parts
  'pytest-missing-fixture-name-underscore', # flake8-pytest-style: fixture does not return
  'start-process-with-partial-path', # Starting a process with a partial executable path
  'subprocess-run-without-check', # `subprocess.run` without explicit `check` argument
  'subprocess-without-shell-equals-true', # `subprocess` call: check for execution of untrusted input
  'suspicious-non-cryptographic-random-usage', # Standard pseudo-random generators are not suitable for cryptographic purposes
  'suspicious-subprocess-import', # `subprocess` module is possibly insecure
  'too-many-positional-arguments', # Too many positional arguments (6/5)
  'too-many-public-methods', # Too many public methods
  'undocumented-public-function', # Missing docstring in public function
  'undocumented-public-module', # Missing docstring in public module
  'unused-function-argument', # Unused function argument: `line`
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.tomlsort]
all = true
in_place = true
trailing_comma_inline_array = true

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.9.0"

[tool.uv.build-backend]
module-name = "diacea"
module-root = ""
