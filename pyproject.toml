[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9.26,<2.0"]

[dependency-groups]
dev = [
  "calcipy[recommended]>=6.0.1",
  "hypothesis>=6.100",
  "lzstring>=1.0.4",
  "types-pyyaml>=6.0",
]

[project]
authors = [
  {email = "dev.act.kyle@gmail.com", name = "Kyle King"},
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
] # https://pypi.org/classifiers/
dependencies = [
  "corallium>=2.2.0",
  "networkx>=3.4.2,<4",
  "python-constraint2>=2.0.0b8,<3",
  "pyyaml>=6.0,<7",
]
description = "Convert between Excalidraw and PlantUML"
keywords = ["calcipy_template"]
license = "MIT"
maintainers = []
name = "diacea"
readme = "docs/README.md"
requires-python = ">=3.10.11"
version = "0.0.1"

[project.entry-points."mkdocs.plugins"]
diacea = "diacea.mkdocs_plugin:DiaceaPlugin"

[project.optional-dependencies]
mkdocs = [
  "mkdocs>=1.5",
]
obsidian = [
  "lzstring>=1.0.4",
]

[project.scripts]
diacea = "diacea.cli:main"
diacea-workspace = "diacea.workspace_cli:main_workspace"

[project.urls]
"Bug Tracker" = "https://github.com/kyleking/diacea/issues"
"Changelog" = "https://github.com/kyleking/diacea/blob/main/docs/docs/CHANGELOG.md"
"Documentation" = "https://diacea.kyleking.me"
"Repository" = "https://github.com/kyleking/diacea"

[tool.commitizen]
pre_bump_hooks = ["uv lock"]
version = "0.0.1"
version_files = ["pyproject.toml:^version", "diacea/__init__.py:^__version"]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
enable_error_code = ["ignore-without-code", "possibly-undefined", "redundant-expr", "truthy-bool"]
extra_checks = true
files = ["diacea", "tests"]
no_implicit_reexport = true
plugins = [
]
python_version = "3.10"
show_column_numbers = true
show_error_codes = true
strict_equality = true
warn_no_return = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.pyright]
include = ["diacea", "tests"]
pythonVersion = "3.10"

[tool.ruff]
# Docs: https://github.com/charliermarsh/ruff
# Tip: uv run ruff rule RUF100
line-length = 120
target-version = 'py310'

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
ignore = [
  'ANN002', # Missing type annotation for `*args`
  'ANN003', # Missing type annotation for `**kwargs`
  'ANN401', # Dynamically typed expressions (typing.Any) are disallowed in `pop_key`
  'ANN204', # Missing return type annotation for special method `__init__`
  # TODO: annotate the dunder methods and drop this
  'ARG002', # Unused method argument
  # TODO: drop the unused parameters or prefix them with an underscore and drop this
  'BLE001', # Do not catch blind exception: `Exception`
  'C901', # `parse` is too complex
  # TODO: split the oversized parser and generator entry points and drop this
  'COM812', # Conflicts with formatter
  'CPY001', # Missing copyright notice at top of file
  'D101', # Missing docstring in public class
  # TODO: document the public classes and drop this
  'D102', # Missing docstring in public method
  # TODO: document the public methods and drop this
  'D107', # Missing docstring in `__init__`
  # TODO: document the public constructors and drop this
  'D203', # "1 blank line required before class docstring" (Conflicts with D211)
  'D213', # "Multi-line docstring summary should start at the second line" (Conflicts with D212)
  'DOC201', # Missing "Returns" in docstring; prefer minimal docstrings
  'DOC501', # Raised exception `RuntimeError` missing from docstring
  'DOC502', # Raised exception is not explicitly raised: `ValueError`
  # TODO: reconcile the docstring `Raises` sections with what each function raises and drop this
  'EM101', # Exception must not use a string literal, assign to variable first
  'FBT001', # Boolean-typed positional argument in function definition
  # TODO: make the boolean parameters keyword-only and drop this
  'FBT002', # Boolean default positional argument in function definition
  # TODO: make the boolean parameters keyword-only and drop this
  'FIX001', # Line contains FIXME
  'FIX002', # Line contains TODO
  'FIX004', # Line contains HACK
  'PLC0415', # `import` should be at the top-level of a file
  # TODO: hoist the deferred imports and drop this
  'PLR0911', # Too many return statements
  # TODO: split the branch-heavy dispatch functions and drop this
  'PLR0912', # Too many branches
  # TODO: split the branch-heavy dispatch functions and drop this
  'PLR0913', # Too many arguments in function definition (6 > 5)
  'PLR0914', # Too many local variables
  # TODO: extract helpers from the long parser functions and drop this
  'PLR0915', # Too many statements
  # TODO: extract helpers from the long parser functions and drop this
  'PLR0917', # Too many positional arguments
  # TODO: make the trailing parameters keyword-only and drop this
  'PLR2004', # Magic value used in comparison
  # TODO: name the geometry and threshold constants and drop this
  'PLR6301', # Method could be a function, class method, or static method
  # TODO: annotate test helpers and stateless methods and drop this
  'RUF067', # `__init__` module should only contain docstrings and re-exports
  'SLF001', # Private member accessed
  # TODO: promote the needed internals to public API and drop this
  'T201', # `print` found
  # TODO: replace print() in the library with logging and drop this
  'TID252', # Prefer absolute imports over relative imports from parent modules
  # TODO: convert the intra-package relative imports to absolute and drop this
  'TC001', # Move application import `tail_jsonl.config.Config` into a type-checking block (Conflicts with Beartype)
  'TC002', # Move third-party import `rich.console.Console` into a type-checking block (Conflicts with Beartype)
  'TC003', # Move standard library import `argparse` into a type-checking block (Conflicts with Beartype)
  'TD001', # Invalid TODO tag: `FIXME`
  'TD002', # Missing author in TODO; try: `# TODO(<author_name>): ...`
  'TD003', # Missing issue link on the line following this TODO
  'TRY003', # Avoid specifying long messages outside the exception class
  'TRY004', # Prefer `TypeError` exception for invalid type
  # TODO: raise TypeError for type mismatches and drop this
  'TRY301', # Abstract `raise` to an inner function
  # TODO: narrow each try block to one failure mode and drop this
]
preview = true
select = ['ALL']
unfixable = [
  'ERA001', # Commented out code
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'

[tool.ruff.lint.flake8-tidy-imports.banned-api]
'invoke.collection.Collection'.msg = 'Use calcipy.collection.Collection instead.'
'invoke.tasks.task'.msg = 'Use calcipy.cli.task instead.'
'typing.Callable'.msg = 'Use "from collections.abc" instead.'
'typing.Dict'.msg = 'Use "from __future__ import annotations"'
'typing.List'.msg = 'Use "from __future__ import annotations"'
'typing.Optional'.msg = 'Use "from __future__ import annotations"'
'typing.Protocol'.msg = 'Use "from beartype.typing" instead.'

[tool.ruff.lint.isort]
known-first-party = ['diacea']

[tool.ruff.lint.per-file-ignores]
'./diacea/../*.py' = [
  'INP001', # File `/<>.py` is part of an implicit namespace package. Add an `__init__.py`.
]
'__init__.py' = [
  'D104', # Missing docstring in public package
]
'scripts/*.py' = [
  'D103', # Missing docstring in public function
  'INP001', # File `scripts/*.py` is part of an implicit namespace package. Add an `__init__.py`.
  'S108', # Probable insecure usage of temporary file or directory
  # TODO: write benchmark output under tempfile.mkdtemp() and drop this
  'S311', # Standard pseudo-random generators are not suitable for cryptographic purposes
]
'scripts/check_imports.py' = [
  'F401', # imported but unused; consider adding to __all__ or using a redundant alias
]
'tests/*.py' = [
  'ANN001', # Missing type annotation for function argument
  'ANN201', # Missing return type annotation for public function
  'ANN202', # Missing return type annotation for private function `test_make_diffable`
  'ARG001', # Unused function argument: `line`
  'D100', # Missing docstring in public module
  'D103', # Missing docstring in public function
  'PLC2701', # Private name import `_<>` from external module
  'PLR0904', # Too many public methods
  'PLR0917', # Too many positional arguments (6/5)
  'PLW1510', # `subprocess.run` without explicit `check` argument
  'PT004', # flake8-pytest-style: fixture does not return
  'PT018', # Assertion should be broken down into multiple parts
  'RUF069', # Use `math.isclose` instead of comparing floats
  # TODO: compare parser float output with math.isclose and drop this
  'S101', # Use of `assert` detected
  'S108', # Probable insecure usage of temporary file or directory
  'S311', # Standard pseudo-random generators are not suitable for cryptographic purposes
  'S404', # `subprocess` module is possibly insecure
  'S603', # `subprocess` call: check for execution of untrusted input
  'S607', # Starting a process with a partial executable path
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.tomlsort]
all = true
in_place = true
trailing_comma_inline_array = true

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.9.0"

[tool.uv.build-backend]
module-name = "diacea"
module-root = ""
